<!DOCTYPE html>
<!-- We have modified the standard Blazor WASM Index.hmtl file to rely on assets
    in the BlazorUI razor library project where the App UI lives. The intent is to
    have the skinniest WASMApp possible so all App level UI code lives in the
    BlazorUI library. -->
<html lang="en">

<head>
    <!-- We use no-cache because we implement our own caching strategy for all assets. -->
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <base href="{{BASE_HREF}}" />
    <link href="WASMApp.styles.css" rel="stylesheet" />
    <link href="_content/LazyMagic.Blazor/css/app.css" rel="stylesheet" />
    <link href="_content/LazyMagic.Blazor/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="manifest.json" rel="manifest" />

    <!-- DEBUG: Early sessionStorage dump and state storage fix -->
    <script>
        (function() {
            console.log('=== EARLY sessionStorage dump (before Blazor) ===');
            console.log('URL:', window.location.href);
            console.log('sessionStorage keys:', Object.keys(sessionStorage));
            for (var key of Object.keys(sessionStorage)) {
                var value = sessionStorage.getItem(key);
                // Show full content for auth-related keys
                if (key.includes('Auth') || key.startsWith('oidc')) {
                    console.log('  ' + key + ':', value);
                } else {
                    console.log('  ' + key + ':', value ? value.substring(0, 100) + (value.length > 100 ? '...' : '') : 'null');
                }
            }

            // Check if we're on the login-callback page
            if (window.location.href.includes('/authentication/login-callback')) {
                console.log('On callback page - checking for stored state');

                var urlParams = new URLSearchParams(window.location.search);
                var urlState = urlParams.get('state');
                console.log('URL state:', urlState);

                // Check for Microsoft OIDC state keys (they start with 'oidc.')
                var oidcKeys = Object.keys(sessionStorage).filter(function(k) { return k.startsWith('oidc.'); });
                console.log('OIDC keys in sessionStorage:', oidcKeys);

                if (oidcKeys.length === 0 && urlState) {
                    console.log('WARNING: No oidc.* keys found in sessionStorage - state may not have been stored before redirect');
                    console.log('This is likely a race condition. The OIDC library may retry automatically.');
                }
            }

            // Monitor for navigation to capture state before redirect
            var originalAssign = window.location.assign;
            window.location.assign = function(url) {
                console.log('location.assign called with:', url);
                if (url && url.includes('state=')) {
                    var match = url.match(/state=([^&]+)/);
                    if (match) {
                        console.log('Capturing state before redirect:', match[1]);
                        sessionStorage.setItem('oidc_custom_state', match[1]);
                    }
                }
                return originalAssign.call(window.location, url);
            };

            console.log('=== END EARLY setup ===');
        })();
    </script>

    <!-- Load addLink(), addScript() functions -->
    <script src="_content/LazyMagic.Blazor/indexconfig.js"></script>
    <!-- indexhead.js uses addLink() and addHeadScript() to add required elements -->
    <!--<script src="_content/BlazorUI/indexhead.js"></script>-->
    <script src="indexhead.js"></script>
</head>

<body>
    <div class="status-bar-safe-area"></div>
    <div id="main">
        <div class="loading-progress" style="width: 9rem; height: 9rem; margin-left: 1rem; margin-top: 1rem;">
            <svg viewBox="0 0 100 100">
                <circle r="40" cx="50" cy="50" />
                <circle r="40" cx="50" cy="50" />
            </svg>
            <div class="loading-progress-text"></div>
            <div class="loading-message-text">Loading App</div>
        </div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- indexbody.js uses addBodyScript() to add required elements -->
    <!--<script src="_content/BlazorUI/indexbody.js"></script>-->
    <script src="indexbody.js"></script>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>

    <!-- The indexinit.js registers the service worker. We do this to avoid
        cors issues with inline scripts. Note that the service-worker.js is
        different for local dev and published content. See service-worker.js
        and service-worker-published.js. Specifically, MSBuild publish copies
        service-worker-published.js to service-worker.js. -->
    <script type="module" src="indexinit.js"></script>
</body>


</html>

name: Publish NuGet

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history, not a shallow clone. Nerdbank.GitVersioning derives the version from commit
        # HEIGHT, so a depth-1 checkout computes the wrong one - silently, because there is nothing
        # for it to fail on. Set before NBGV lands rather than after (MigrationPlan M1).
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        # This repo is 29 projects on net10.0 (plus 7 on netstandard2.0, which any modern SDK
        # builds). It carried 8.x/9.x, neither of which can build net10.0 - the workflow has run
        # once, on 2025-09-25, long before the net10 conversion, so nothing caught it.
        dotnet-version: 10.x

    - name: Configure NuGet
      run: |
        cat > NuGet.Config << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            <add key="github" value="https://nuget.pkg.github.com/LazyMagicOrg/index.json" />
          </packageSources>
          <packageSourceCredentials>
            <github>
              <add key="Username" value="USERNAME" />
              <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
            </github>
          </packageSourceCredentials>
          <packageSourceMapping>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
            <packageSource key="github">
              <package pattern="LazyMagic.*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF

        cat NuGet.Config

    - name: Restore dependencies
      run: |
        dotnet restore

    - name: Build # Build solution
      run: dotnet build --no-restore

    - name: Publish
      run: |
        dotnet nuget push ./Packages/*.nupkg --source https://nuget.pkg.github.com/LazyMagicOrg/index.json --api-key ${{ secrets.GITHUB_TOKEN }}
        dotnet nuget push ./Packages/*.snupkg --source https://nuget.pkg.github.com/LazyMagicOrg/index.json --api-key ${{ secrets.GITHUB_TOKEN }}
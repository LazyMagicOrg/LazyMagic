name: Publish NuGet

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history, not a shallow clone. Nerdbank.GitVersioning derives the version from commit
        # HEIGHT, and a depth-1 checkout has no history to count. Measured on a real depth-1 clone
        # against the pinned 3.10.94: NBGV throws "Shallow clone lacks the objects required to
        # calculate version height" and fails the build with MSB4018. So this is a hard stop rather
        # than a silent wrong number - an earlier version of this comment claimed the opposite.
        # Set before NBGV landed rather than after (MigrationPlan M1).
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        # global-json-file, not a floating dotnet-version. This repo now pins an exact SDK with
        # rollForward: disable, so "10.x" would install whatever is newest and then be REJECTED by
        # that pin. Reading the same file the build reads is the only way the two cannot disagree.
        #
        # History worth keeping: this carried 8.x/9.x, neither of which can build net10.0. The
        # workflow had run once, on 2025-09-25, long before the net10 conversion, so nothing
        # caught it - a floating version that is never exercised is not a safe default.
        global-json-file: global.json

    - name: Configure NuGet
      run: |
        cat > NuGet.Config << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            <add key="github" value="https://nuget.pkg.github.com/LazyMagicOrg/index.json" />
          </packageSources>
          <packageSourceCredentials>
            <github>
              <add key="Username" value="USERNAME" />
              <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
            </github>
          </packageSourceCredentials>
          <packageSourceMapping>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
            <packageSource key="github">
              <package pattern="LazyMagic.*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF

        cat NuGet.Config

    - name: Restore dependencies
      run: |
        dotnet restore

    - name: Build # Build solution
      run: dotnet build --no-restore

    - name: Publish
      run: |
        dotnet nuget push ./Packages/*.nupkg --source https://nuget.pkg.github.com/LazyMagicOrg/index.json --api-key ${{ secrets.GITHUB_TOKEN }}
        dotnet nuget push ./Packages/*.snupkg --source https://nuget.pkg.github.com/LazyMagicOrg/index.json --api-key ${{ secrets.GITHUB_TOKEN }}
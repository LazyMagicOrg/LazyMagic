name: Publish NuGet

# TRIGGERS ON dev, NOT main, and that is the whole point of this file's current shape.
#
# `dev` is this repo's release line in practice - it is the branch every workspace consumes and the
# one the ProjectTemplates are validated against; main and test lag it. What it publishes is an
# ALPHA line (`3.0.N-alpha`, from version.json's label), because code on dev may never reach main.
# Promotion is then a merge plus two edits to version.json on main: drop the `-alpha` and point
# publicReleaseRefSpec at main. Neither renumbers anything - measured 2026-09-07, a label-only
# change to the version field preserves commit height (5 -> 6 -> 7 across two probe commits), so
# `3.0.24-alpha` promotes to a `3.0.25`-and-upward stable line rather than resetting.
#
# workflow_dispatch as well, so a publish can be re-run without a commit.
on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history, not a shallow clone. Nerdbank.GitVersioning derives the version from commit
        # HEIGHT, and a depth-1 checkout has no history to count. Measured on a real depth-1 clone
        # against the pinned 3.10.94: NBGV throws "Shallow clone lacks the objects required to
        # calculate version height" and fails the build with MSB4018. So this is a hard stop rather
        # than a silent wrong number - an earlier version of this comment claimed the opposite.
        # Set before NBGV landed rather than after (MigrationPlan M1).
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        # global-json-file, not a floating dotnet-version. This repo now pins an exact SDK with
        # rollForward: disable, so "10.x" would install whatever is newest and then be REJECTED by
        # that pin. Reading the same file the build reads is the only way the two cannot disagree.
        #
        # History worth keeping: this carried 8.x/9.x, neither of which can build net10.0. The
        # workflow had run once, on 2025-09-25, long before the net10 conversion, so nothing
        # caught it - a floating version that is never exercised is not a safe default.
        global-json-file: global.json

    - name: Configure NuGet
      run: |
        cat > NuGet.Config << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <configuration>
          <packageSources>
            <clear />
            <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            <add key="github" value="https://nuget.pkg.github.com/LazyMagicOrg/index.json" />
          </packageSources>
          <packageSourceCredentials>
            <github>
              <add key="Username" value="USERNAME" />
              <add key="ClearTextPassword" value="${{ secrets.GITHUB_TOKEN }}" />
            </github>
          </packageSourceCredentials>
          <packageSourceMapping>
            <packageSource key="nuget.org">
              <package pattern="*" />
            </packageSource>
            <packageSource key="github">
              <package pattern="LazyMagic.*" />
            </packageSource>
          </packageSourceMapping>
        </configuration>
        EOF

    - name: Restore dependencies
      run: |
        dotnet restore

    - name: Build # Build solution
      run: dotnet build --no-restore

    # THE TWO PUBLISH GUARDS (SdlcVersioning 4.6), between build and push. This is the step that
    # makes `dev` publishing safe: it refuses anything NBGV did not stamp as a public release - i.e.
    # anything carrying the `-g<hex>` commit-id discriminator - and anything not built from the
    # commit being published.
    #
    # Run from SOURCE rather than as an installed `lz`: the runner has no Lz feed for the lz runner
    # to resolve Lz.Cli from. That is safe here despite this repo coming FIRST in the publish order,
    # because no Lz project references a LazyMagic package - checked, not assumed - so building the
    # guard cannot depend on what this job is about to publish.
    #
    # fetch-depth: 0 on the Lz checkout is REQUIRED, not tidiness: Lz derives its own version with
    # NBGV, which throws MSB4018 on a shallow clone rather than guessing a height. A default depth-1
    # checkout would fail this step and block every publish.
    - uses: actions/checkout@v4
      with:
        repository: LazyMagicOrg/Lz
        ref: main
        fetch-depth: 0
        path: _lz

    # --source is deliberately NOT passed, so guard one (already-published) does not run yet.
    # Measured 2026-09-07: GitHub Packages answers 403 for the flat container's version list even
    # with a token that restores fine, so the lookup can only return "undeterminable" - which
    # refuses, and would therefore block every publish. Until that lookup goes through NuGet's own
    # client, the registry's own duplicate rejection is the backstop, which is exactly why
    # --skip-duplicate stays off on the push below.
    - name: publish guards
      run: |
        dotnet run --project _lz/Lz.Cli/Lz.Cli.csproj -c Debug           -p:SolutionDir=${{ github.workspace }}/_lz/           -- packages check --packages ./Packages --commit ${{ github.sha }}

    - name: Publish
      run: |
        dotnet nuget push ./Packages/*.nupkg --source https://nuget.pkg.github.com/LazyMagicOrg/index.json --api-key ${{ secrets.GITHUB_TOKEN }}
        dotnet nuget push ./Packages/*.snupkg --source https://nuget.pkg.github.com/LazyMagicOrg/index.json --api-key ${{ secrets.GITHUB_TOKEN }}